<h2>Change Password</h2>
<form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">

  <mat-form-field class="full-width">
    <mat-label>Old Password</mat-label>
    <input matInput type="password" formControlName="oldPassword">
    <mat-error *ngIf="submitted && changePasswordForm.controls['oldPassword'].invalid">
      Old password is required
    </mat-error>
  </mat-form-field>

  <mat-form-field class="full-width">
    <mat-label>New Password</mat-label>
    <input matInput type="password" formControlName="newPassword">
    <mat-error *ngIf="submitted && changePasswordForm.controls['newPassword'].invalid">
      New password must be at least 12 characters
    </mat-error>
  </mat-form-field>

  <div class="button-row mt-2">
    <button mat-button type="submit" color="primary">Change</button>
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
  </div>
</form>
